// ─── HELPERS ─────────────────────────────────────────────────────────────────
function parsePrice(p) { return parseInt(p.replace(/\./g,'').replace('$','').replace(',',''), 10) || 0; }
function fmtPrice(n) { return Number(n).toLocaleString('es-VE') + '$'; }
function getProteinCount(desc) {
  if (!desc) return 0;
  const m = desc.match(/(\d+) Proteín/);
  return m ? parseInt(m[1]) : 0;
}

     <span class="protein-name">${p}</span>
   </div>`
).join('');

// ─── NAV ─────────────────────────────────────────────────────────────────────
let activeSection = 'cachapas';
const navEl = document.getElementById('nav');
function buildNav() {
  navEl.innerHTML = SECTIONS.map(s =>
    `<button class="nav-btn${s.id===activeSection?' active':''}" onclick="show('${s.id}')">${s.emoji} ${s.label}</button>`
  ).join('');
}
function show(id) {
  activeSection = id;
  buildNav();
  renderMain();
  navEl.querySelector('.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
buildNav();

// ─── CART ────────────────────────────────────────────────────────────────────
let cart = {};
let cartView = 'cart';
let lastOrderId = null;

function cartCount() { return Object.values(cart).reduce((s,i)=>s+i.quantity, 0); }
function cartTotal() { return Object.values(cart).reduce((s,i)=>s+i.priceNum*i.quantity, 0); }

function addToCart(name, price, section) {
  const key = section + '||' + name;
  const priceNum = parsePrice(price);
  if (cart[key]) cart[key].quantity++;
  else cart[key] = {name, price, priceNum, quantity:1, section};
  updateFab();
}
function incCart(key) { if (cart[key]) { cart[key].quantity++; updateFab(); renderCartBody(); } }
function decCart(key) {
  if (!cart[key]) return;
  if (cart[key].quantity <= 1) delete cart[key];
  else cart[key].quantity--;
  updateFab();
  renderCartBody();
}
function clearCart() { cart = {}; updateFab(); }
function updateFab() {
  const n = cartCount();
  document.getElementById('cart-fab').style.display = n > 0 ? 'flex' : 'none';
  document.getElementById('cart-count').textContent = n;
}
function handleAdd(name, price, section, desc) {
  const count = getProteinCount(desc);
  if (count > 0) openPicker(name, price, section, count);
  else addToCart(name, price, section);
}

// ─── CART DRAWER ─────────────────────────────────────────────────────────────
function openCart() {
  cartView = 'cart';
  renderCartBody();
  document.getElementById('cart-overlay').classList.add('open');
  document.getElementById('cart-drawer').classList.add('open');
}
function closeCart() {
  document.getElementById('cart-overlay').classList.remove('open');
  document.getElementById('cart-drawer').classList.remove('open');
}

function renderCartBody() {
  const titleEl    = document.getElementById('cart-title');
  const subtitleEl = document.getElementById('cart-subtitle');
  const bodyEl     = document.getElementById('cart-body');
  const items      = Object.entries(cart);

  if (cartView === 'success') {
    titleEl.textContent = '¡Pedido Enviado!'; subtitleEl.textContent = '';
    bodyEl.innerHTML = `<div class="success-view">
      <div class="success-icon">✅</div>
      <div class="success-title">Pedido #${lastOrderId} Recibido</div>
      <div class="success-msg">Tu pedido fue enviado al personal.<br>En breve lo estarán preparando.</div>
      <button class="btn-success" onclick="closeCart()">Seguir Viendo el Menú</button>
    </div>`;
    return;
  }

  if (cartView === 'checkout') {
    titleEl.textContent = 'Confirmar Pedido'; subtitleEl.textContent = '';
    const summaryRows = items.map(([,i]) =>
      `<div class="checkout-summary-row"><span>${i.quantity}× ${i.name}</span><span class="checkout-summary-price">${fmtPrice(i.priceNum*i.quantity)}</span></div>`
    ).join('');
    bodyEl.innerHTML = `
      <div class="cart-scroll">
        <div style="padding:20px 0 10px">
          <div class="checkout-summary-label">Resumen</div>
          ${summaryRows}
          <div class="checkout-total-row">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;color:#888;text-transform:uppercase">Total</span>
            <span style="font-family:'Bebas Neue',cursive;font-size:22px;color:#F5A800">${fmtPrice(cartTotal())}</span>
          </div>
        </div>
        <label class="form-label">Nombre *</label>
        <input id="f-name" class="form-input" placeholder="Tu nombre">
        <label class="form-label">Mesa (opcional)</label>
        <input id="f-mesa" class="form-input" placeholder="Ej: Mesa 3, Para llevar...">
        <label class="form-label">Notas (opcional)</label>
        <textarea id="f-notes" class="form-input" placeholder="Sin cebolla, extra salsa..."></textarea>
        <div style="height:20px"></div>
      </div>
      <div class="cart-footer">
        <div style="display:flex;gap:10px">
          <button class="btn-secondary" onclick="cartView='cart';renderCartBody()">Volver</button>
          <button id="confirm-btn" class="btn-primary" style="flex:2" onclick="submitOrder()">Confirmar Pedido</button>
        </div>
      </div>`;
    return;
  }

  titleEl.textContent = 'Tu Pedido';
  const count = cartCount();
  subtitleEl.textContent = count > 0 ? count + (count===1?' ítem':' ítems') : '';

  if (items.length === 0) {
    bodyEl.innerHTML = `<div class="cart-scroll"><div class="cart-empty"><div class="cart-empty-icon">🛒</div><div class="cart-empty-text">Tu carrito está vacío</div></div></div>`;
    return;
  }

  const rows = items.map(([key, item]) => {
    const sk = encodeURIComponent(key);
    return `<div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${item.price}</div>
      </div>
      <div class="cart-item-controls">
        <button class="qty-btn" data-key="${sk}" data-op="dec">−</button>
        <span class="qty-num">${item.quantity}</span>
        <button class="qty-btn" style="border-color:#F5A800;color:#F5A800" data-key="${sk}" data-op="inc">+</button>
      </div>
      <div class="cart-item-subtotal">${fmtPrice(item.priceNum*item.quantity)}</div>
    </div>`;
  }).join('');

  bodyEl.innerHTML = `
    <div class="cart-scroll" id="cart-scroll-inner">${rows}</div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-val">${fmtPrice(cartTotal())}</span>
      </div>
      <button class="btn-primary" onclick="cartView='checkout';renderCartBody()">Hacer Pedido</button>
    </div>`;

  document.getElementById('cart-scroll-inner').addEventListener('click', function(e) {
    const btn = e.target.closest('[data-op]');
    if (!btn) return;
    const key = decodeURIComponent(btn.dataset.key);
    if (btn.dataset.op === 'dec') decCart(key);
    else incCart(key);
  });
}

async function submitOrder() {
  const name = (document.getElementById('f-name')?.value||'').trim();
  if (!name) { alert('Por favor ingresa tu nombre'); return; }
  const btn = document.getElementById('confirm-btn');
  if (btn) { btn.textContent='Enviando...'; btn.disabled=true; }
  try {
    const res = await fetch('/api/orders',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        customerName: name,
        tableNumber: (document.getElementById('f-mesa')?.value||'').trim(),
        notes: (document.getElementById('f-notes')?.value||'').trim(),
        items: Object.values(cart).map(i=>({itemName:i.name,itemPrice:i.price,itemPriceNum:i.priceNum,quantity:i.quantity,section:i.section}))
      })
    });
    if (!res.ok) throw new Error('Error');
    const data = await res.json();
    lastOrderId = data.id;
    clearCart(); cartView='success'; renderCartBody();
  } catch {
    alert('Error al enviar el pedido. Intenta de nuevo.');
    if (btn) { btn.textContent='Confirmar Pedido'; btn.disabled=false; }
  }
}

// ─── PROTEIN PICKER ──────────────────────────────────────────────────────────
let pickerState = null, pickerSelected = [];
function openPicker(name, price, section, count) {
  pickerState = {name, price, section, count}; pickerSelected = [];
  document.getElementById('picker-item-name').textContent = name;
  document.getElementById('picker-meta-label').textContent = count===1?'Elige 1 proteína':'Elige '+count+' proteínas';
  renderPickerDots(); renderPickerGrid();
  document.getElementById('picker-overlay').classList.add('open');
}
function closePicker() {
  document.getElementById('picker-overlay').classList.remove('open');
  pickerState=null; pickerSelected=[];
}
function renderPickerDots() {
  const count = pickerState?.count||0;
  document.getElementById('picker-dots').innerHTML = Array.from({length:count},(_,i)=>
    `<div class="picker-dot${i<pickerSelected.length?' filled':''}"></div>`).join('');
}
function renderPickerGrid() {
  const count = pickerState?.count||0;
  document.getElementById('picker-grid').innerHTML = PROTEINS.map(p => {
    const sel=pickerSelected.includes(p), dis=!sel&&pickerSelected.length>=count;
    return `<button class="picker-protein-btn${sel?' selected':''}" data-protein="${p}" ${dis?'disabled':''}>
      <span class="picker-protein-emoji">${PROTEIN_EMOJI[p]||'🍴'}</span>
      <span class="picker-protein-label">${p}</span>
      <span class="picker-checkmark">✓</span>
    </button>`;
  }).join('');
  document.getElementById('picker-grid').onclick = function(e) {
    const btn=e.target.closest('[data-protein]');
    if (!btn||btn.disabled) return;
    toggleProtein(btn.dataset.protein);
  };
  const ready = pickerSelected.length===count;
  const cb = document.getElementById('picker-confirm');
  cb.textContent = ready?'Agregar al Pedido':'Faltan '+(count-pickerSelected.length);
  cb.className = 'picker-confirm'+(ready?' ready':'');
}
function toggleProtein(p) {
  if (pickerSelected.includes(p)) pickerSelected=pickerSelected.filter(x=>x!==p);
  else if (pickerSelected.length<pickerState.count) pickerSelected.push(p);
  renderPickerDots(); renderPickerGrid();
}
function confirmPicker() {
  if (!pickerState||pickerSelected.length!==pickerState.count) return;
  addToCart(pickerState.name+' ('+pickerSelected.join(', ')+')', pickerState.price, pickerState.section);
  closePicker();
}

// ─── RENDER MENU ─────────────────────────────────────────────────────────────
function sectionHeader(emoji, title) {
  return `<div class="section-header"><span>${emoji}</span><h2>${title}</h2></div>`;
}
function subHeader(emoji, title) {
  return `<div class="sub-header"><span>${emoji}</span><h3>${title}</h3></div>`;
}
function menuRowHTML(item, section) {
  return `<div class="menu-row${item.sep?' sep':''}">
    <div class="menu-row-info">
      <div class="menu-row-name">${item.name}</div>
      ${item.desc?`<div class="menu-row-desc">${item.desc}</div>`:''}
    </div>
    <div class="menu-row-right">
      <div class="menu-price">${item.price}</div>
      <button class="add-btn menu-add" data-name="${encodeURIComponent(item.name)}" data-price="${item.price}" data-section="${section}" data-desc="${encodeURIComponent(item.desc||'')}">+</button>
    </div>
  </div>`;
}
function comboCardHTML(item, section, descForPicker) {
  const includes = item.includes.map(l=>`<div>${l}</div>`).join('');
  return `<div class="combo-card">
    <div class="combo-accent"></div>
    <div class="combo-badge">${item.badge}</div>
    <div class="combo-name">${item.name}</div>
    <div class="combo-includes">${includes}</div>
    <div class="combo-footer">
      <div class="combo-price">${item.price}</div>
      <button class="combo-add-btn menu-add" data-name="${encodeURIComponent(item.name)}" data-price="${item.price}" data-section="${section}" data-desc="${encodeURIComponent(descForPicker||'')}">+ Agregar</button>
    </div>
  </div>`;
}

function renderMain() {
  const mainEl = document.getElementById('main');
  let html = '<div class="section-content">';
  const s = activeSection;

  if (s==='cachapas') {
    html += sectionHeader('🌽','Cachapas');
    html += CACHAPAS.map(i=>menuRowHTML(i,'cachapas')).join('');
  } else if (s==='burgers') {
    html += sectionHeader('🍔','Hamburguesas');
    html += `<p class="section-note">${BURGERS_NOTE}</p>`;
    html += BURGERS.map(i=>menuRowHTML(i,'burgers')).join('');
  } else if (s==='hotdogs') {
    html += sectionHeader('🌭','Perros Calientes');
    html += HOTDOGS.map(i=>menuRowHTML(i,'hotdogs')).join('');
  } else if (s==='burritos') {
    html += sectionHeader('🌯','Burritos');
    html += `<p class="section-note">${BURRITOS_NOTE}</p>`;
    html += BURRITOS.map(i=>menuRowHTML(i,'burritos')).join('');
  } else if (s==='morocho') {
    html += sectionHeader('🥙','Morocho');
    html += MOROCHO.map(i=>comboCardHTML(i,'morocho','')).join('');
  } else if (s==='especiales') {
    html += sectionHeader('⭐','Especiales');
    html += ESPECIALES.map(i=>comboCardHTML(i,'especiales',i.includes[0]||'')).join('');
    html += subHeader('🥗','Ensaladas');
    html += ENSALADAS.map(i=>comboCardHTML(i,'ensaladas','')).join('');
  } else if (s==='papas') {
    html += sectionHeader('🍟','Papas');
    html += PAPAS.map(i=>menuRowHTML(i,'papas')).join('');
  } else if (s==='combos') {
    html += sectionHeader('🔥','Combos');
    html += COMBOS.map(i=>comboCardHTML(i,'combos',i.desc||'')).join('');
  } else if (s==='adicionales') {
    html += sectionHeader('➕','Adicionales');
    html += '<div class="adicionales-grid">';
    html += ADICIONALES.map(i=>
      `<div class="add-item">
         <span class="add-item-name">${i.name}</span>
         <div class="add-item-right">
           <span class="add-item-price">${i.price}</span>
           <button class="mini-add-btn menu-add" data-name="${encodeURIComponent(i.name)}" data-price="${i.price}" data-section="adicionales" data-desc="">+</button>
         </div>
       </div>`
    ).join('');
    html += '</div>';
  } else if (s==='bebidas') {
    html += sectionHeader('🥤','Bebidas');
    html += BEBIDAS.map(i=>
      `<div class="drink-item">
         <span class="drink-name">${i.name}</span>
         <div class="drink-right">
           <span class="drink-price">${i.price}</span>
           <button class="mini-add-btn menu-add" data-name="${encodeURIComponent(i.name)}" data-price="${i.price}" data-section="bebidas" data-desc="">+</button>
         </div>
       </div>`
    ).join('');
  }

  html += '</div>';
  mainEl.innerHTML = html;

  mainEl.addEventListener('click', function(e) {
    const btn = e.target.closest('.menu-add');
    if (!btn) return;
    handleAdd(
      decodeURIComponent(btn.dataset.name),
      btn.dataset.price,
      btn.dataset.section,
      decodeURIComponent(btn.dataset.desc)
    );
  });
}

renderMain();
